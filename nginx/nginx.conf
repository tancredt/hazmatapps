server {
    listen 80;
    server_name _;

    # 1. Main Inventory App
    location /apps/inventory/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /apps/inventory/index.html;
    }

    # 2. District Cache App (UPDATED)
    location /apps/cache/ {
        root /usr/share/nginx/html; # 👈 Explicitly set the correct root
        try_files $uri $uri/ /apps/cache/index.html; # 👈 Fallback to the correct index.html
    }

    # 3. Django Admin & API
    location /admin/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Django Static Files
    location /static/ {
        alias /usr/share/nginx/html/staticfiles/;
    }

    # 5. Django Media Files
    location /media/ {
        alias /usr/share/nginx/html/media/;
    }
}